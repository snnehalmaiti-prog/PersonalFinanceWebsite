name: Update MF NAV history

# Bundles every mapped fund's NAV history into mf_history.json so the dashboard
# makes one same-origin request on a cold load instead of one per fund to
# api.mfapi.in. Mirrors the stock side (fetch_stock_prices.py -> stock_history.json).
#
# Runs after the AMFI NAV job so a day's NAVs are published before this reads them,
# and on demand when the mapping changes.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - mfmapping.json
      - fetch_mf_history.py

permissions:
  contents: write

# A mapping push and the nightly run must not race each other into the same file.
concurrency:
  group: mf-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch MF NAV history
        run: python3 fetch_mf_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Staged BEFORE comparing: git diff ignores untracked files, so for a
          # file that has never been committed it reports "no changes"
          # every time and the commit below never runs. That is how
          # mf_history.json went months being rebuilt nightly by a green
          # workflow that never once published it. --cached sees a newly
          # added file, so this works for the first commit and every one after.
          git add mf_history.json
          if git diff --cached --quiet -- mf_history.json; then
            echo "No changes to mf_history.json"
          else
            git commit -m "chore: update mf_history.json"
            # Rebase before pushing, and retry. Four workflows commit data
            # files to main and their schedules overlap — the AMFI NAV and MF
            # history runs collided within two seconds of each other, and the
            # loser got a non-fast-forward rejection. Nothing was wrong with
            # the data; it simply pushed second.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed; retrying"
              sleep $((RANDOM % 10 + 5))
            done
          fi
