name: Update AMFI ISIN map

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch AMFI ISIN map
        run: python3 fetch_amfi_isin_map.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Staged BEFORE comparing: git diff ignores untracked files, so for a
          # file that has never been committed it reports "no changes"
          # every time and the commit below never runs. That is how
          # mf_history.json went months being rebuilt nightly by a green
          # workflow that never once published it. --cached sees a newly
          # added file, so this works for the first commit and every one after.
          git add amfi_isin_map.json
          if git diff --cached --quiet -- amfi_isin_map.json; then
            echo "No changes to amfi_isin_map.json"
          else
            git commit -m "Update AMFI ISIN map"
            # Rebase before pushing, and retry. Four workflows commit data
            # files to main and their schedules overlap — the AMFI NAV and MF
            # history runs collided within two seconds of each other, and the
            # loser got a non-fast-forward rejection. Nothing was wrong with
            # the data; it simply pushed second.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed; retrying"
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Publish AMFI ISIN map to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: https://jotirmhoohsquqvungrm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 publish_market_data.py amfi_isin
