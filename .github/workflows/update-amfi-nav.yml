name: Update AMFI NAV data

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch AMFI NAV data
        run: python3 fetch_amfi_nav.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Staged BEFORE comparing: git diff ignores untracked files, so for a
          # file that has never been committed it reports "no changes"
          # every time and the commit below never runs. That is how
          # mf_history.json went months being rebuilt nightly by a green
          # workflow that never once published it. --cached sees a newly
          # added file, so this works for the first commit and every one after.
          git add amfi_nav.json
          if git diff --cached --quiet -- amfi_nav.json; then
            echo "No changes to amfi_nav.json"
          else
            git commit -m "Update AMFI NAV data"
            git push
          fi

      - name: Publish AMFI NAV to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: https://jotirmhoohsquqvungrm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 publish_market_data.py amfi_nav
