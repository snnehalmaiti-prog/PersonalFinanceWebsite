name: Deploy static site to Pages

# Self-controlled GitHub Pages deployment using the official actions on the
# Node 24 runtime (replaces the GitHub-managed "pages build and deployment"
# pipeline, which still runs Node-20 actions and has been wedging).
#
# ACTIVATION (one-time):
#   1. Repo Settings -> Pages -> Source: switch from "Deploy from a branch"
#      to "GitHub Actions".
#   2. Run this workflow (Actions tab -> "Deploy static site to Pages" ->
#      "Run workflow"), or uncomment the `push:` trigger below so it deploys
#      automatically on every push to the branch.
#
# While the Pages source is still "Deploy from a branch", this workflow's
# deploy step cannot create a Pages deployment and will error — so it is
# left on manual (workflow_dispatch) only until the source is switched.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Fill in the __ASSET_VERSION__ placeholder with this commit's SHA, so every
      # deploy serves fresh cache-busting URLs for CSS/JS and a fresh service-worker
      # cache name. Only the uploaded artifact is modified; the repo keeps the
      # placeholder. This replaces bumping version tags by hand, which had already
      # drifted (index.html served a different script.js version than dashboard.html).
      - name: Stamp asset versions
        run: node tools/stamp-assets.js
      # The artifact used to be the whole repo. Nothing in it is secret — the SQL
      # is schema-only and the Supabase anon key is correctly public — but it
      # shipped the defect register, every fetch script, both schema files, 80+
      # test files and docs/ to a public site that needs none of them. Dead weight
      # on every deploy and a larger public surface than the app requires.
      #
      # A deny-list rather than an allow-list, deliberately: the site needs the
      # market-data JSON blobs, icons/, vendor/ and the PWA files, and a missed
      # allow-list entry is a broken deploy while a missed deny-list entry is only
      # an extra file. The listing at the end puts what actually ships in the
      # workflow log, so a mistake either way is visible rather than silent.
      - name: Prune non-site files from the artifact
        run: |
          rm -rf tests docs tools __pycache__ node_modules .github
          rm -f ./*.py ./*.sql ./*.xlsx ./*.md ./vendor/*.md
          echo "--- files being deployed ---"
          find . -type f -not -path "./.git/*" | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
